# Multi-Heart-Model CI/CD Pipeline
# Tests both D (Primal Overlay) and Python (HBCM) components
name: Multi-Heart-Model CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-python:
    name: Test Python Components
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate integration
      run: |
        python validate_integration.py

    - name: Validate organ chip
      run: |
        python validate_organchip.py

    - name: Install package
      run: |
        pip install -e . --no-build-isolation

    - name: Run pytest
      run: |
        pytest tests/ -v --tb=short --continue-on-collection-errors || true

  build-d:
    name: Build D Primal Overlay
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dlang-community/setup-dlang@4c99aa991ce7d19dd3064de0a4f2f6b2f152e2d7

    - name: 'Build Primal Overlay'
      run: |
        # Build the project, with its main file included, without unittests
        dub build --compiler=$DC
        # Verify the executable was created
        test -f ./primal_overlay

    - name: 'Test D components'
      run: |
        # Build and run tests, as defined by `unittest` configuration
        # In this mode, `mainSourceFile` is excluded and `version (unittest)` are included
        # See https://dub.pm/package-format-json.html#configurations
        dub test --compiler=$DC || true
