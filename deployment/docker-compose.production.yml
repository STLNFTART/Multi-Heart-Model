version: '3.8'

# Multi-Heart-Model Production Deployment
#
# Services:
# - PostgreSQL (database)
# - Redis (caching, rate limiting, pub/sub)
# - Mosquitto (MQTT broker with TLS)
# - FastAPI backend (Python API)
# - Node.js gateway (OpenSim bridge, TAK integration)
# - Node-RED (visual dashboard and workflow)
# - NGINX (reverse proxy, TLS termination, load balancing)
# - Prometheus (metrics collection)
# - Grafana (visualization)
#
# Usage:
#   docker-compose -f docker-compose.production.yml up -d
#
# Prerequisites:
#   - Generate TLS certificates (run deployment/security/generate_certificates.sh)
#   - Configure production.env (copy from production.env.example)
#   - Review and adjust resource limits for your environment

services:

  # ===========================================================================
  # Database Layer
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: multiheart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: multiheart_prod
      POSTGRES_USER: multiheart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiheart"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  redis:
    image: redis:7-alpine
    container_name: multiheart-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # MQTT Broker
  # ===========================================================================

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: multiheart-mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"    # MQTT over TLS
      - "9001:9001"    # WebSockets over TLS
    volumes:
      - ./security/mosquitto_production.conf:/mosquitto/config/mosquitto.conf:ro
      - ./security/mosquitto_passwd:/mosquitto/config/mosquitto_passwd:ro
      - ./security/mosquitto_acl.conf:/mosquitto/config/mosquitto_acl.conf:ro
      - ./security/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # Python Backend (FastAPI)
  # ===========================================================================

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
      args:
        PYTHON_VERSION: "3.11"
    image: multiheart-api:latest
    container_name: multiheart-api
    restart: unless-stopped
    env_file:
      - ./security/production.env
    environment:
      - DATABASE_URL=postgresql://multiheart:${POSTGRES_PASSWORD}@postgres:5432/multiheart_prod
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MQTT_HOST=mosquitto
      - MQTT_PORT=8883
    volumes:
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      - ./security/certs:/app/certs:ro
      - api_logs:/app/logs
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # Node.js Gateway
  # ===========================================================================

  nodejs_gateway:
    build:
      context: ../nodejs_gateway
      dockerfile: ../deployment/Dockerfile.nodejs
    image: multiheart-nodejs:latest
    container_name: multiheart-nodejs
    restart: unless-stopped
    env_file:
      - ./security/production.env
    environment:
      - PORT=3000
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MQTT_URL=mqtts://mosquitto:8883
    volumes:
      - ../nodejs_gateway:/app:ro
      - ./security/certs:/app/certs:ro
      - nodejs_logs:/app/logs
    networks:
      - backend
      - frontend
    depends_on:
      - redis
      - mosquitto
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # Node-RED Dashboard
  # ===========================================================================

  nodered:
    image: nodered/node-red:latest
    container_name: multiheart-nodered
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - TZ=America/Chicago
      - NODE_RED_ENABLE_SAFE_MODE=false
      - NODE_RED_ENABLE_PROJECTS=true
    volumes:
      - ../nodered:/data
      - ./security/certs:/data/certs:ro
    networks:
      - backend
      - frontend
    depends_on:
      - mosquitto
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # NGINX Reverse Proxy
  # ===========================================================================

  nginx:
    image: nginx:alpine
    container_name: multiheart-nginx
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP (redirect to HTTPS)
      - "443:443"    # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./security/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    networks:
      - frontend
    depends_on:
      - api
      - nodejs_gateway
      - nodered
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # Monitoring - Prometheus
  # ===========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: multiheart-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # Monitoring - Grafana
  # ===========================================================================

  grafana:
    image: grafana/grafana:latest
    container_name: multiheart-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
      - frontend
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true

# =============================================================================
# Networks
# =============================================================================

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16

# =============================================================================
# Volumes
# =============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local
  api_logs:
    driver: local
  nodejs_logs:
    driver: local
  nginx_logs:
    driver: local
  nginx_cache:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
