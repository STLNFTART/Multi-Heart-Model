# Mosquitto MQTT Broker - Production Configuration
# Multi-Heart-Model System
#
# Security Features:
# - TLS/SSL encryption
# - Client certificate authentication
# - Username/password authentication
# - Access control lists (ACLs)
# - Rate limiting
#
# Usage:
#   mosquitto -c mosquitto_production.conf

# =============================================================================
# Network Configuration
# =============================================================================

# Standard MQTT port (unencrypted) - DISABLED in production
# listener 1883 localhost

# MQTT over TLS/SSL (encrypted)
listener 8883
protocol mqtt

# WebSockets over TLS (for browser clients)
listener 9001
protocol websockets

# Bind to all interfaces (change to specific IP for security)
# bind_address 0.0.0.0

# =============================================================================
# TLS/SSL Configuration
# =============================================================================

# Path to CA certificate
cafile /home/user/Multi-Heart-Model/deployment/security/certs/ca.crt

# Path to server certificate
certfile /home/user/Multi-Heart-Model/deployment/security/certs/server.crt

# Path to server private key
keyfile /home/user/Multi-Heart-Model/deployment/security/certs/server.key

# Require client certificates (mutual TLS)
require_certificate true

# Verify client certificates against CA
use_identity_as_username false

# TLS version (only TLS 1.2 and 1.3)
tls_version tlsv1.2

# Cipher suites (strong ciphers only)
ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

# =============================================================================
# Authentication
# =============================================================================

# Disable anonymous connections (CRITICAL for production)
allow_anonymous false

# Password file (hashed passwords)
password_file /home/user/Multi-Heart-Model/deployment/security/mosquitto_passwd

# ACL file (access control lists)
acl_file /home/user/Multi-Heart-Model/deployment/security/mosquitto_acl.conf

# =============================================================================
# Persistence
# =============================================================================

# Enable message persistence
persistence true
persistence_location /var/lib/mosquitto/

# Autosave interval (seconds)
autosave_interval 300

# Persist QoS 0 messages
persistence_qos 0

# =============================================================================
# Logging
# =============================================================================

# Log to file and stdout
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout

# Log types
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe

# Log timestamp format
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# =============================================================================
# Performance & Limits
# =============================================================================

# Maximum queued messages per client
max_queued_messages 1000

# Maximum QoS (0, 1, or 2)
max_qos 2

# Maximum packet size (bytes)
max_packet_size 10485760

# Message size limit (10 MB)
message_size_limit 10485760

# Maximum number of clients
max_connections 1000

# =============================================================================
# Security Headers
# =============================================================================

# Disable protocol version downgrade
allow_downgrade false

# Connection timeout (seconds)
keepalive 60

# =============================================================================
# WebSocket Specific
# =============================================================================

# WebSocket protocol name
websockets_protocol mqtt

# =============================================================================
# Rate Limiting (via plugin or external tool)
# =============================================================================

# Note: Mosquitto doesn't have built-in rate limiting.
# Use external tools like:
# - iptables for connection rate limiting
# - Reverse proxy (NGINX) for request rate limiting
# - Custom authentication plugin

# =============================================================================
# Monitoring
# =============================================================================

# Statistics publication interval (0 = disabled)
sys_interval 60

# =============================================================================
# Bridge Configuration (for multi-site deployments)
# =============================================================================

# Uncomment for bridge to cloud MQTT broker
# connection cloud-bridge
# address mqtt.cloud-provider.com:8883
# topic # out 0 multi-heart/ cloud/multi-heart/
# bridge_cafile /path/to/cloud-ca.crt
# bridge_certfile /path/to/client.crt
# bridge_keyfile /path/to/client.key
# bridge_protocol_version mqttv311
# try_private false
# start_type automatic
# restart_timeout 30
