# Mosquitto Access Control List (ACL) Configuration
# Multi-Heart-Model System
#
# Format:
#   user <username>
#   topic [read|write|readwrite] <topic>
#
# Wildcards:
#   + : single level wildcard
#   # : multi-level wildcard

# =============================================================================
# Admin User - Full Access
# =============================================================================

user admin
topic readwrite #

# =============================================================================
# HBCM Simulation Service
# =============================================================================

user hbcm_service
# Publish simulation data
topic write hbcm/simulation/data
topic write hbcm/simulation/state
topic write hbcm/simulation/events

# Subscribe to control commands
topic read hbcm/control/commands
topic read hbcm/control/parameters

# Subscribe to configuration
topic read hbcm/config/#

# =============================================================================
# Node-RED Dashboard
# =============================================================================

user nodered
# Full access to dashboard topics
topic readwrite dashboard/#
topic readwrite hbcm/#
topic readwrite motorhand/#
topic readwrite opensim/#

# Subscribe to all data for visualization
topic read +/+/data
topic read +/+/state

# =============================================================================
# MotorHandPro Control System
# =============================================================================

user motorhand
# Publish sensor data
topic write motorhand/sensors/+
topic write motorhand/status

# Subscribe to control commands
topic read motorhand/control/commands
topic read motorhand/control/setpoints

# Emergency stop (read/write)
topic readwrite motorhand/emergency/stop

# =============================================================================
# OpenSim Integration
# =============================================================================

user opensim
# Publish biomechanical data
topic write opensim/kinematics
topic write opensim/dynamics
topic write opensim/forces

# Subscribe to HBCM state for coupling
topic read hbcm/simulation/state

# =============================================================================
# Web Control Panel Backend
# =============================================================================

user web_backend
# Full access to API topics
topic readwrite api/#

# Read all system data for dashboard
topic read hbcm/#
topic read motorhand/#
topic read opensim/#

# Write configuration changes
topic write +/config/#

# =============================================================================
# Monitoring & Logging Service
# =============================================================================

user monitor
# Read-only access to all data
topic read #

# Write monitoring data
topic write monitoring/metrics
topic write monitoring/logs
topic write monitoring/alerts

# =============================================================================
# TAK Integration (Tactical Awareness Kit)
# =============================================================================

user tak_bridge
# Publish soldier physiological data to TAK
topic write tak/cot/physiological
topic write tak/cot/medical

# Subscribe to HBCM data
topic read hbcm/simulation/data

# Subscribe to alerts
topic read +/emergency/+
topic read +/alerts/+

# =============================================================================
# IoT Sensors (Individual device access)
# =============================================================================

# Heart rate sensor
user sensor_heart_001
topic write sensors/heart/001/data
topic read sensors/heart/001/config

# Blood pressure sensor
user sensor_bp_001
topic write sensors/bp/001/data
topic read sensors/bp/001/config

# ECG sensor
user sensor_ecg_001
topic write sensors/ecg/001/data
topic read sensors/ecg/001/config

# =============================================================================
# Research / Data Collection
# =============================================================================

user researcher
# Read-only access to all simulation data
topic read hbcm/#
topic read motorhand/#
topic read opensim/#
topic read sensors/#

# Write research annotations
topic write research/annotations
topic write research/notes

# =============================================================================
# External API Integrations
# =============================================================================

# Neuralink integration (if deployed)
user neuralink_bridge
topic read hbcm/neural/state
topic write neuralink/neural/commands

# Tesla/Optimus integration (if deployed)
user optimus_bridge
topic read hbcm/simulation/data
topic write optimus/physiological/state

# =============================================================================
# Pattern-Based ACLs
# =============================================================================

# Device-specific topics (pattern: device/<device_id>/...)
# Each device can only access its own topics
pattern read device/%u/#
pattern write device/%u/#

# User-specific topics (pattern: user/<username>/...)
pattern readwrite user/%u/#

# =============================================================================
# Deny Rules (explicit denies)
# =============================================================================

# Deny all users access to system topics by default
# (unless explicitly granted above)
user anonymous
topic read $SYS/#
